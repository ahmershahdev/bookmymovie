; BookMyMovie production PHP settings.
; OPcache options are system-level and cannot live in .htaccess.
; XAMPP: paste into C:\xampp\php\php.ini (then restart Apache).
; Linux: save as /etc/php/8.2/fpm/conf.d/99-bookmymovie.ini (then reload php-fpm).

zend_extension=opcache
opcache.enable=1
opcache.enable_cli=0
opcache.memory_consumption=192
opcache.interned_strings_buffer=16
opcache.max_accelerated_files=20000
opcache.validate_timestamps=0      ; production: run `php artisan optimize` + reload PHP on deploy
opcache.revalidate_freq=0
opcache.save_comments=1            ; Laravel relies on docblocks in places
opcache.jit=tracing
opcache.jit_buffer_size=64M

realpath_cache_size=4096K
realpath_cache_ttl=600

; Hardening
expose_php=Off
display_errors=Off
log_errors=On
session.cookie_httponly=1
session.use_strict_mode=1
upload_max_filesize=6M
post_max_size=8M
